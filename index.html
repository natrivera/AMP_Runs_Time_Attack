<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Embedded Dashboard</title>
    <style>
        /* Remove browser margins and prevent scrollbars on the main page */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f9f9f9;
        }

        /* Force the iframe to fill the entire viewport exactly */
        .fullscreen-iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      Replace the URL in the src attribute below with your own Tableau Public URL.
      Ensure you keep the "?:embed=y&:showVizHome=no" URL parameters attached.
    -->
    <iframe 
        src="https://public.tableau.com/app/profile/natrivera/viz/AMPTimeAttackRuns_17893379178850/MyFastest" 
        class="fullscreen-iframe"
        allowfullscreen>
    </iframe>

</body>
</html>
